# Publie le site (dossier web/ : accueil, maquette 3D, simulateur, manuel) à la racine de GitHub Pages.
# Ne tourne que sur le dépôt public : la condition du job l'ignore ailleurs.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'docteurzoidberg/raidmaster-403'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploiement
        uses: actions/deploy-pages@v4
